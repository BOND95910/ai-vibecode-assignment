# e-Service กลาง เทศบาลนครตัวอย่าง (หน่วยงานสมมติ)
#
#   docker compose up --build                         # เว็บจริง (ไม่มี test hook) → http://localhost:3000
#   TEST_MODE=1 docker compose up --build             # เปิด /api/test/* (reset/clock/pay/tamper) สำหรับ Playwright
#   TEST_MODE=1 BUG_MODE=B03,B07 docker compose up    # เปิดบั๊กตาม BUGS.md (ไม่ตั้ง = เว็บถูกต้อง 100%)
#
# ฐานข้อมูล SQLite อยู่ที่ ./data/egov.db บนเครื่อง (DB_PATH=/data/egov.db ในคอนเทนเนอร์) → TC-NFR-04 ตรวจไฟล์นี้ได้
# TEST_MODE=1: ทุกครั้งที่เริ่มเว็บจะ reset + seed + นาฬิกา 2026-12-01T09:00:00+07:00 (ผลซ้ำได้)

services:
  web:
    build: .
    image: egov-eservice:local
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      TEST_MODE: "${TEST_MODE:-}"
      BUG_MODE: "${BUG_MODE:-}"
      DB_PATH: /data/egov.db
      BASE_URL: "${BASE_URL:-}"
      TZ: Asia/Bangkok
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
